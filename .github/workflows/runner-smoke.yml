name: Private runner smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on:
      - self-hosted
      - linux
      - x64
      - virtualwardrobe-private
    timeout-minutes: 5
    steps:
      - name: Check runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -n "${RUNNER_NAME}"
          test -n "${RUNNER_LABELS}"
          test -d "${GITHUB_WORKSPACE}"
          printf 'runner=%s labels=%s workspace=%s\n' "$RUNNER_NAME" "$RUNNER_LABELS" "$GITHUB_WORKSPACE"